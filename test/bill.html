<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            padding: 20px;
        }
        .invoice-container {
            width: 21cm;
            height: 29.7cm;
            padding: 20px;
            background: #fff;
            margin: auto;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header, .footer {
            text-align: center;
        }
        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .invoice-header div {
            width: 48%;
        }
        .invoice-header div:first-child {
            text-align: left;
        }
        .invoice-header div:last-child {
            text-align: right;
        }
        .invoice-header h2 {
            margin: 0;
        }
        .invoice-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .invoice-details div {
            width: 48%;
        }
        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .invoice-table th, .invoice-table td {
            border: 1px solid #000;
            padding: 8px;
            text-align: center;
        }
        .invoice-table th {
            background: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="invoice-container">
        <div class="header">
            <h1>Invoice</h1>
        </div>
        <div class="invoice-header">
            <div>
                <h2>Company Name</h2>
                <p>Address Line 1</p>
                <p>Address Line 2</p>
            </div>
            <div>
                <p>Date: <span id="invoice-date"></span></p>
                <p>Invoice No: <span id="invoice-number"></span></p>
            </div>
        </div>
        <div class="invoice-details">
            <div>
                <p>Customer Name: <span id="customer-name"></span></p>
                <p>Address: <span id="customer-address"></span></p>
            </div>
            <div>
                <p>GST No: <span id="gst-number"></span></p>
            </div>
        </div>
        <table class="invoice-table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Description</th>
                    <th>Quantity</th>
                    <th>Rate</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="invoice-items">
                <!-- Items will be injected by JavaScript -->
            </tbody>
        </table>
        <div class="footer">
            <p>Total Amount: Rs. <span id="total-amount"></span></p>
        </div>
    </div>
    <script>
        // Dummy data for the invoice
        const invoiceData = {
            date: '16/07/2024',
            invoiceNumber: '2503',
            customerName: 'John Doe',
            customerAddress: '123 Main Street, City, Country',
            gstNumber: '36AQEPP9660P1ZX',
            items: [
                { item: 'Item 1', description: 'Description for Item 1', quantity: 2, rate: 50, amount: 100 },
                { item: 'Item 2', description: 'Description for Item 2', quantity: 1, rate: 150, amount: 150 },
            ],
            totalAmount: 250
        };

        // Populate invoice details
        document.getElementById('invoice-date').textContent = invoiceData.date;
        document.getElementById('invoice-number').textContent = invoiceData.invoiceNumber;
        document.getElementById('customer-name').textContent = invoiceData.customerName;
        document.getElementById('customer-address').textContent = invoiceData.customerAddress;
        document.getElementById('gst-number').textContent = invoiceData.gstNumber;

        // Populate invoice items
        const invoiceItemsContainer = document.getElementById('invoice-items');
        invoiceData.items.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.item}</td>
                <td>${item.description}</td>
                <td>${item.quantity}</td>
                <td>${item.rate}</td>
                <td>${item.amount}</td>
            `;
            invoiceItemsContainer.appendChild(row);
        });

        // Populate total amount
        document.getElementById('total-amount').textContent = invoiceData.totalAmount;
    </script>
</body>
</html>
