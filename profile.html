<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <style>
        body {
            padding:0px;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
        }
        
        .container {
            margin-top: 20px;
        }
        .card {
            border: 1px solid #ced4da;
            border-radius: 5px;
        }
        .card-header {
            background-color: #343a40;
            color: #fff;
        }
        .card-body {
            background-color: #fff;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }
        .form-control {
            border-radius: 5px;
            border: 1px solid #ced4da;
        }
        .sidenav {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        .sidenav a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }

        .sidenav a:hover {
            color: #f1f1f1;
        }

        .sidenav .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }

        @media screen and (max-height: 450px) {
            .sidenav {padding-top: 15px;}
            .sidenav a {font-size: 18px;}
        }
    </style>
</head>
<body>
    <header class="bg-primary text-white py-3">
        <span style="font-size:30px;cursor:pointer" onclick="openNav()">&#9776;</span>
        <h1 class="text-center">New Punnami Agro Agencies <br> Seeds and Pesticides Stock Management</h1>
    </header>

    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#dashboard" class="nav-link">Dashboard</a>
        <a href="#settings" class="nav-link">Settings</a>
        <a href="profile.html" class="nav-link">Profile</a>
        <a href="#bills-saved" class="nav-link">Bills Saved</a>
        <a class="nav-link active" aria-current="page" href="#manage-stock">Manage Stock</a>
        <a class="nav-link" href="#billing">Billing</a>
        <a class="nav-link" href="#view-stock">View Stock</a>
        <a class="nav-link" href="r.html">Stock Register</a>
    </div>

    <div class="content">
        <div class="container my-4">
            <section id="profile" class="mb-4">
                <h2>Profile</h2>
                <div class="card">
                    <div class="card-header">
                        Profile Details
                        <button class="btn btn-secondary float-end" id="edit-profile-btn">Edit</button>
                    </div>
                    <div class="card-body">
                        <form id="profile-form" style="display: none;">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="profile-name" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="profile-name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="profile-email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="profile-email" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="profile-phone" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="profile-phone" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="profile-address" class="form-label">Address</label>
                                    <input type="text" class="form-control" id="profile-address" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </form>
                        <div id="profile-details">
                            
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('edit-profile-btn').addEventListener('click', function() {
            document.getElementById('profile-form').style.display = 'block';
            document.getElementById('profile-details').style.display = 'none';

            document.getElementById('profile-name').value = document.getElementById('display-name').textContent;
            document.getElementById('profile-email').value = document.getElementById('display-email').textContent;
            document.getElementById('profile-phone').value = document.getElementById('display-phone').textContent;
            document.getElementById('profile-address').value = document.getElementById('display-address').textContent;
        });

        document.getElementById('profile-form').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('display-name').textContent = document.getElementById('profile-name').value;
            document.getElementById('display-email').textContent = document.getElementById('profile-email').value;
            document.getElementById('display-phone').textContent = document.getElementById('profile-phone').value;
            document.getElementById('display-address').textContent = document.getElementById('profile-address').value;

            document.getElementById('profile-form').style.display = 'none';
            document.getElementById('profile-details').style.display = 'block';
        });
        // Function to open side navigation
        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
        }
        
        // Function to close side navigation
        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }
    </script>
</body>
</html>
